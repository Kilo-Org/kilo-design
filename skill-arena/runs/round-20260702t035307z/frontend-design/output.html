<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kilo Cloud Model Selector</title>
  <style>
    :root {
      --paper: #f3f0e8;
      --paper-2: #e7e1d5;
      --ink: #181713;
      --ink-soft: #4f4a40;
      --hairline: #c9c0b2;
      --panel: #fffaf0;
      --panel-strong: #fff4df;
      --charcoal: #25221d;
      --charcoal-2: #302b24;
      --cloud: #e6f7f5;
      --teal: #0f8b7f;
      --teal-dark: #0a635b;
      --gold: #a56518;
      --gold-soft: #f5d28f;
      --red: #b24a39;
      --disabled: #8f877a;
      --shadow: 0 28px 80px rgba(30, 25, 16, .18), 0 8px 24px rgba(30, 25, 16, .1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(90deg, rgba(37, 34, 29, .045) 1px, transparent 1px) 0 0 / 42px 42px,
        linear-gradient(rgba(37, 34, 29, .04) 1px, transparent 1px) 0 0 / 42px 42px,
        radial-gradient(circle at 18px 18px, rgba(15, 139, 127, .08) 1px, transparent 1.5px) 0 0 / 42px 42px,
        var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      letter-spacing: 0;
    }

    button,
    textarea {
      font: inherit;
    }

    .workspace {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .composer {
      width: min(920px, 100%);
      position: relative;
      border: 1px solid rgba(88, 79, 64, .24);
      background: rgba(255, 250, 240, .86);
      box-shadow: 0 22px 70px rgba(52, 43, 26, .12);
      backdrop-filter: blur(10px);
    }

    .composer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      padding: 10px 12px 10px 16px;
      border-bottom: 1px solid rgba(88, 79, 64, .2);
      background: linear-gradient(180deg, rgba(255, 250, 240, .96), rgba(245, 240, 228, .92));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--charcoal);
      font-size: 14px;
      font-weight: 700;
    }

    .brand-mark {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(15, 99, 91, .35);
      background:
        linear-gradient(135deg, transparent 45%, rgba(255, 250, 240, .86) 45% 55%, transparent 55%),
        linear-gradient(135deg, #143d37, #0f8b7f);
      color: #fffaf0;
      font-size: 11px;
      font-weight: 800;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button,
    .send-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(88, 79, 64, .22);
      background: rgba(255, 250, 240, .78);
      color: var(--ink-soft);
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .icon-button:hover,
    .send-button:hover {
      transform: translateY(-1px);
      border-color: rgba(15, 139, 127, .5);
      background: #fffaf0;
    }

    .send-button {
      background: var(--charcoal);
      color: #fffaf0;
      border-color: var(--charcoal);
    }

    .model-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid rgba(15, 139, 127, .42);
      background: var(--cloud);
      color: var(--teal-dark);
      cursor: pointer;
      box-shadow: inset 0 -1px 0 rgba(15, 99, 91, .12);
    }

    .trigger-copy {
      display: grid;
      gap: 1px;
      text-align: left;
      line-height: 1.1;
    }

    .trigger-kicker {
      color: rgba(10, 99, 91, .76);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .trigger-name {
      color: var(--teal-dark);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chevron {
      width: 14px;
      height: 14px;
      transition: transform .18s ease;
    }

    .model-trigger[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }

    .composer-body {
      display: grid;
      gap: 12px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 250, 240, .52), rgba(255, 250, 240, .86)),
        var(--panel);
    }

    .prompt-field {
      width: 100%;
      min-height: 128px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.42;
    }

    .prompt-field::placeholder {
      color: rgba(79, 74, 64, .56);
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: rgba(79, 74, 64, .74);
      font-size: 12px;
    }

    .context-chips {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .context-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 26px;
      padding: 0 8px;
      border: 1px solid rgba(88, 79, 64, .18);
      background: rgba(243, 240, 232, .76);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 650;
    }

    .model-popover {
      position: absolute;
      z-index: 5;
      right: 54px;
      top: 48px;
      width: min(520px, calc(100vw - 36px));
      border: 1px solid rgba(34, 31, 26, .28);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: pop-in .22s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .popover-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 16px;
      background:
        linear-gradient(90deg, rgba(15, 139, 127, .12), transparent 56%),
        var(--panel-strong);
      border-bottom: 1px solid rgba(88, 79, 64, .18);
    }

    .popover-title {
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.05;
    }

    .popover-subtitle {
      margin: 5px 0 0;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 650;
    }

    .current-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      min-height: 28px;
      padding: 5px 9px;
      border: 1px solid rgba(15, 139, 127, .35);
      background: var(--cloud);
      color: var(--teal-dark);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .model-list {
      display: grid;
      gap: 0;
      padding: 8px;
    }

    .model-option {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      padding: 13px 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .model-option + .model-option {
      border-top-color: rgba(88, 79, 64, .14);
    }

    .model-option:hover:not(:disabled) {
      border-color: rgba(15, 139, 127, .28);
      background: rgba(230, 247, 245, .58);
      transform: translateY(-1px);
    }

    .model-option.is-selected {
      border-color: rgba(15, 139, 127, .5);
      background:
        linear-gradient(90deg, rgba(15, 139, 127, .15), transparent 58%),
        #fffaf0;
    }

    .model-option:disabled {
      cursor: not-allowed;
      color: var(--disabled);
      background: repeating-linear-gradient(
        -45deg,
        rgba(143, 135, 122, .055),
        rgba(143, 135, 122, .055) 7px,
        transparent 7px,
        transparent 14px
      );
    }

    .model-main {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .model-name-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .model-name {
      color: currentColor;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
    }

    .model-desc {
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.35;
      max-width: 38rem;
    }

    .model-option:disabled .model-desc {
      color: rgba(79, 74, 64, .68);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 6px;
      border: 1px solid rgba(88, 79, 64, .18);
      background: rgba(243, 240, 232, .78);
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 850;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .badge.recommended {
      border-color: rgba(165, 101, 24, .38);
      background: #fff0c7;
      color: #79480c;
    }

    .badge.enterprise {
      border-color: rgba(178, 74, 57, .28);
      background: rgba(178, 74, 57, .08);
      color: var(--red);
    }

    .tradeoffs {
      display: grid;
      grid-template-columns: minmax(104px, 150px) minmax(104px, 150px) auto;
      align-items: center;
      gap: 10px;
    }

    .metric {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .metric-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: rgba(79, 74, 64, .78);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .meter {
      height: 6px;
      border: 1px solid rgba(88, 79, 64, .16);
      background: rgba(88, 79, 64, .08);
      overflow: hidden;
    }

    .meter-fill {
      display: block;
      height: 100%;
      width: var(--value);
      background: linear-gradient(90deg, var(--teal), var(--gold-soft));
    }

    .model-option:disabled .meter-fill {
      background: rgba(143, 135, 122, .45);
    }

    .price {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 7px;
      border: 1px solid rgba(88, 79, 64, .18);
      background: rgba(255, 250, 240, .7);
      color: var(--ink-soft);
      font-family: "SF Mono", "Cascadia Mono", Menlo, monospace;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .model-state {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 34px;
    }

    .check,
    .lock {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 1px solid currentColor;
    }

    .check {
      background: var(--teal);
      color: #fffaf0;
    }

    .lock {
      color: rgba(143, 135, 122, .82);
      background: rgba(255, 250, 240, .52);
    }

    .popover-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid rgba(88, 79, 64, .18);
      background: var(--charcoal);
      color: #f7ecdb;
    }

    .usage-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
      font-size: 11px;
      line-height: 1.3;
    }

    .usage-copy strong {
      color: #fff8e9;
      font-size: 12px;
    }

    .usage-meter {
      width: 108px;
      height: 8px;
      flex: 0 0 auto;
      border: 1px solid rgba(247, 236, 219, .22);
      background: rgba(247, 236, 219, .1);
    }

    .usage-meter span {
      display: block;
      height: 100%;
      width: 48%;
      background: linear-gradient(90deg, #f5d28f, #37c5b4);
    }

    svg {
      display: block;
    }

    @media (max-width: 680px) {
      .workspace {
        padding: 16px;
        align-items: start;
      }

      .composer {
        margin-top: 18px;
      }

      .composer-bar {
        flex-wrap: wrap;
      }

      .composer-actions {
        width: 100%;
        justify-content: flex-end;
      }

      .model-popover {
        position: relative;
        top: auto;
        right: auto;
        width: auto;
        margin: 0 10px 10px;
      }

      .tradeoffs {
        grid-template-columns: 1fr 1fr;
      }

      .price {
        grid-column: 1 / -1;
      }

      .popover-top,
      .popover-bottom {
        align-items: stretch;
        flex-direction: column;
      }

      .current-pill,
      .usage-meter {
        width: fit-content;
      }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="composer" aria-label="Agent prompt composer">
      <div class="composer-bar">
        <div class="brand" aria-label="Kilo Cloud">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span>Kilo Cloud</span>
        </div>

        <div class="composer-actions">
          <button class="icon-button" type="button" aria-label="Attach context">
            <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12.4 5.7 6.1 12a4.1 4.1 0 0 0 5.8 5.8l7.1-7.1a5.5 5.5 0 0 0-7.8-7.8L4.1 10a6.9 6.9 0 0 0 9.8 9.8l5.6-5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="model-trigger" type="button" aria-haspopup="listbox" aria-expanded="true" aria-controls="model-list">
            <span class="trigger-copy">
              <span class="trigger-kicker">Current model</span>
              <span class="trigger-name" id="trigger-name">Kilo Sonnet 4.5</span>
            </span>
            <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true">
              <path d="m5 7.5 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="send-button" type="button" aria-label="Send prompt">
            <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="model-popover" role="dialog" aria-label="Model selector">
        <div class="popover-top">
          <div>
            <h1 class="popover-title">Choose model</h1>
            <p class="popover-subtitle">Balance speed, depth, and token cost for this agent run.</p>
          </div>
          <span class="current-pill">
            <svg width="13" height="13" viewBox="0 0 20 20" aria-hidden="true">
              <path d="m4 10.4 3.3 3.3L16 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Selected
          </span>
        </div>

        <div class="model-list" id="model-list" role="listbox" aria-label="Available models">
          <button class="model-option is-selected" type="button" role="option" aria-selected="true" data-model="Kilo Sonnet 4.5">
            <span class="model-main">
              <span class="model-name-row">
                <span class="model-name">Kilo Sonnet 4.5</span>
                <span class="badge recommended">Recommended</span>
                <span class="badge">Balanced</span>
              </span>
              <span class="model-desc">Strong coding and agent planning with predictable latency for everyday cloud tasks.</span>
              <span class="tradeoffs" aria-label="Speed and cost tradeoffs">
                <span class="metric">
                  <span class="metric-label"><span>Speed</span><span>Fast</span></span>
                  <span class="meter" aria-hidden="true"><span class="meter-fill" style="--value: 74%"></span></span>
                </span>
                <span class="metric">
                  <span class="metric-label"><span>Reasoning</span><span>High</span></span>
                  <span class="meter" aria-hidden="true"><span class="meter-fill" style="--value: 84%"></span></span>
                </span>
                <span class="price">Cost: $$</span>
              </span>
            </span>
            <span class="model-state" aria-hidden="true">
              <span class="check">
                <svg width="15" height="15" viewBox="0 0 20 20">
                  <path d="m4 10.2 3.4 3.4L16 5.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </span>
          </button>

          <button class="model-option" type="button" role="option" aria-selected="false" data-model="Kilo Haiku 4.5">
            <span class="model-main">
              <span class="model-name-row">
                <span class="model-name">Kilo Haiku 4.5</span>
                <span class="badge">Fastest</span>
              </span>
              <span class="model-desc">Best for short edits, command generation, and low-latency iteration.</span>
              <span class="tradeoffs" aria-label="Speed and cost tradeoffs">
                <span class="metric">
                  <span class="metric-label"><span>Speed</span><span>Very fast</span></span>
                  <span class="meter" aria-hidden="true"><span class="meter-fill" style="--value: 94%"></span></span>
                </span>
                <span class="metric">
                  <span class="metric-label"><span>Reasoning</span><span>Medium</span></span>
                  <span class="meter" aria-hidden="true"><span class="meter-fill" style="--value: 56%"></span></span>
                </span>
                <span class="price">Cost: $</span>
              </span>
            </span>
            <span class="model-state" aria-hidden="true"></span>
          </button>

          <button class="model-option" type="button" role="option" aria-selected="false" data-model="Kilo Opus 4.1">
            <span class="model-main">
              <span class="model-name-row">
                <span class="model-name">Kilo Opus 4.1</span>
                <span class="badge">Deep work</span>
              </span>
              <span class="model-desc">Use for broad refactors, architecture review, and hard debugging when latency matters less.</span>
              <span class="tradeoffs" aria-label="Speed and cost tradeoffs">
                <span class="metric">
                  <span class="metric-label"><span>Speed</span><span>Measured</span></span>
                  <span class="meter" aria-hidden="true"><span class="meter-fill" style="--value: 42%"></span></span>
                </span>
                <span class="metric">
                  <span class="metric-label"><span>Reasoning</span><span>Max</span></span>
                  <span class="meter" aria-hidden="true"><span class="meter-fill" style="--value: 96%"></span></span>
                </span>
                <span class="price">Cost: $$$</span>
              </span>
            </span>
            <span class="model-state" aria-hidden="true"></span>
          </button>

          <button class="model-option" type="button" role="option" aria-selected="false" disabled>
            <span class="model-main">
              <span class="model-name-row">
                <span class="model-name">Kilo Enterprise Max</span>
                <span class="badge enterprise">Enterprise only</span>
              </span>
              <span class="model-desc">Private routing, audit retention controls, and expanded context for organization workspaces.</span>
              <span class="tradeoffs" aria-label="Speed and cost tradeoffs">
                <span class="metric">
                  <span class="metric-label"><span>Speed</span><span>Priority</span></span>
                  <span class="meter" aria-hidden="true"><span class="meter-fill" style="--value: 88%"></span></span>
                </span>
                <span class="metric">
                  <span class="metric-label"><span>Reasoning</span><span>Max</span></span>
                  <span class="meter" aria-hidden="true"><span class="meter-fill" style="--value: 98%"></span></span>
                </span>
                <span class="price">Cost: plan</span>
              </span>
            </span>
            <span class="model-state" aria-hidden="true">
              <span class="lock">
                <svg width="14" height="14" viewBox="0 0 20 20">
                  <path d="M6 8V6.6a4 4 0 0 1 8 0V8m-9 0h10v8H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </span>
          </button>

          <button class="model-option" type="button" role="option" aria-selected="false" disabled>
            <span class="model-main">
              <span class="model-name-row">
                <span class="model-name">Kilo Secure Reasoner</span>
                <span class="badge enterprise">Enterprise only</span>
              </span>
              <span class="model-desc">Compliance-bound reasoning for restricted repositories and customer data environments.</span>
              <span class="tradeoffs" aria-label="Speed and cost tradeoffs">
                <span class="metric">
                  <span class="metric-label"><span>Speed</span><span>Standard</span></span>
                  <span class="meter" aria-hidden="true"><span class="meter-fill" style="--value: 63%"></span></span>
                </span>
                <span class="metric">
                  <span class="metric-label"><span>Reasoning</span><span>High</span></span>
                  <span class="meter" aria-hidden="true"><span class="meter-fill" style="--value: 87%"></span></span>
                </span>
                <span class="price">Cost: plan</span>
              </span>
            </span>
            <span class="model-state" aria-hidden="true">
              <span class="lock">
                <svg width="14" height="14" viewBox="0 0 20 20">
                  <path d="M6 8V6.6a4 4 0 0 1 8 0V8m-9 0h10v8H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </span>
          </button>
        </div>

        <div class="popover-bottom">
          <span class="usage-copy">
            <strong>Workspace credits</strong>
            <span>48% of monthly included model usage remaining</span>
          </span>
          <span class="usage-meter" aria-hidden="true"><span></span></span>
        </div>
      </div>

      <div class="composer-body">
        <textarea class="prompt-field" aria-label="Prompt" placeholder="Ask Kilo to build, debug, refactor, or explain..."></textarea>
        <div class="composer-footer">
          <div class="context-chips" aria-label="Attached context">
            <span class="context-chip">
              <svg width="13" height="13" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M5 3h7l3 3v11H5zM12 3v4h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              repo context
            </span>
            <span class="context-chip">
              <svg width="13" height="13" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M4 5h12M4 10h12M4 15h7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
              cloud workspace
            </span>
          </div>
          <span>12.8k tokens available</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const options = document.querySelectorAll(".model-option:not(:disabled)");
    const triggerName = document.getElementById("trigger-name");
    const checkIcon = '<span class="check"><svg width="15" height="15" viewBox="0 0 20 20"><path d="m4 10.2 3.4 3.4L16 5.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

    options.forEach((option) => {
      option.addEventListener("click", () => {
        options.forEach((item) => {
          item.classList.remove("is-selected");
          item.setAttribute("aria-selected", "false");
          item.querySelector(".model-state").innerHTML = "";
        });

        option.classList.add("is-selected");
        option.setAttribute("aria-selected", "true");
        option.querySelector(".model-state").innerHTML = checkIcon;
        triggerName.textContent = option.dataset.model;
      });
    });
  </script>
</body>
</html>
