<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kilo Cloud Model Selector</title>
  <style>
    :root {
      --background: #151515; /* --surface-background */
      --foreground: #FAFAFA; /* --foreground-default */
      --card: #202020; /* --surface-raised */
      --popover: #333333; /* --surface-overlay */
      --muted: #101010; /* --surface-inset */
      --muted-foreground: #A3A3A3; /* --foreground-muted */
      --primary: #F7F586; /* --brand-primary */
      --primary-foreground: #1F1F1F; /* --brand-foreground */
      --border: #FFFFFF1A; /* --border-default */
      --input: #FFFFFF0A; /* --border-inputBg */
      --ring: #F7F58659; /* --brand-primaryRing */
      --surface-hover: #3A3A3A;
      --surface-selected: #454545;
      --foreground-subtle: #7A7A7A;
      --border-strong: #FFFFFF2E;
      --status-blue300: #93C5FD;
      --status-teal300: #4CE7D7;
      --status-green300: #86EFAC;
      --status-yellow300: #FDD94A;
      --status-orange300: #FDBA74;
      --status-red300: #FCA5A5;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --font-ui: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-code: "Roboto Mono", "SFMono-Regular", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-ui);
      letter-spacing: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 240px),
        var(--background);
      color: var(--foreground);
      font-size: 14px;
      line-height: 1.5;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .workspace {
      width: min(1040px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 56px 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: var(--space-4);
      align-items: start;
    }

    .composer {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--card);
      overflow: hidden;
    }

    .composer-topbar {
      min-height: 48px;
      padding: 0 var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      border-bottom: 1px solid var(--border);
      background: var(--muted);
    }

    .workspace-id,
    .run-state,
    .toolbar-chip,
    .badge,
    .tradeoff,
    .lock-note {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .workspace-id {
      color: var(--foreground);
      font-weight: 600;
    }

    .workspace-id code {
      color: var(--foreground);
      font-family: var(--font-code);
      font-size: 12px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace-dot,
    .state-dot,
    .radio-dot {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .run-state {
      color: var(--muted-foreground);
      font-size: 12px;
      white-space: nowrap;
    }

    .state-dot {
      width: 7px;
      height: 7px;
      background: var(--status-green300);
      box-shadow: none;
    }

    .prompt-area {
      padding: var(--space-4);
      display: grid;
      gap: var(--space-3);
    }

    .field-label {
      color: var(--muted-foreground);
      font-size: 12px;
      font-weight: 600;
    }

    .prompt-input {
      min-height: 180px;
      width: 100%;
      resize: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--input);
      color: var(--foreground);
      padding: var(--space-3);
      outline: none;
    }

    .prompt-input:focus-visible {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .composer-toolbar {
      min-height: 68px;
      padding: var(--space-3) var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      border-top: 1px solid var(--border);
      background: rgba(16, 16, 16, 0.78);
    }

    .model-trigger {
      min-width: min(100%, 280px);
      min-height: 44px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--popover);
      color: var(--foreground);
      padding: 8px 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 18px;
      gap: var(--space-2);
      align-items: center;
      text-align: left;
      cursor: default;
      box-shadow: 0 0 0 3px var(--ring);
    }

    .model-trigger:focus-visible,
    .icon-button:focus-visible,
    .model-row:focus-visible,
    .primary-action:focus-visible {
      outline: 0;
      box-shadow: 0 0 0 3px var(--ring);
      border-color: var(--primary);
    }

    .trigger-kicker,
    .trigger-meta,
    .helper-text,
    .row-copy,
    .tradeoff span,
    .selection-meta {
      color: var(--muted-foreground);
    }

    .trigger-kicker {
      display: block;
      font-size: 11px;
      font-weight: 600;
    }

    .trigger-name {
      display: block;
      overflow: hidden;
      color: var(--foreground);
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .trigger-meta {
      display: block;
      overflow: hidden;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chevron {
      width: 16px;
      height: 16px;
      color: var(--muted-foreground);
    }

    .toolbar-meta {
      min-width: 0;
      display: flex;
      justify-content: flex-end;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .toolbar-chip {
      min-height: 28px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--input);
      color: var(--muted-foreground);
      padding: 4px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .popover-panel {
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      background: var(--popover);
      box-shadow: 0 18px 52px rgba(0, 0, 0, 0.36);
      overflow: hidden;
    }

    .popover-header {
      padding: var(--space-4);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(247, 245, 134, 0.045), rgba(255, 255, 255, 0));
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h2 {
      color: var(--foreground);
      font-size: 16px;
      font-weight: 650;
      line-height: 1.25;
    }

    .helper-text {
      margin-top: 3px;
      font-size: 12px;
    }

    .icon-button {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--input);
      color: var(--muted-foreground);
      display: inline-grid;
      place-items: center;
      cursor: default;
    }

    .icon-button svg {
      width: 16px;
      height: 16px;
    }

    .model-list {
      padding: var(--space-2);
      display: grid;
      gap: var(--space-2);
      background: rgba(16, 16, 16, 0.28);
    }

    .model-row {
      width: 100%;
      min-height: 86px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: transparent;
      padding: var(--space-3);
      display: grid;
      gap: var(--space-2);
      text-align: left;
      cursor: default;
    }

    .model-row:not(:disabled):hover {
      background: var(--surface-hover);
    }

    .model-row.current {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--surface-selected) 78%, var(--primary));
      box-shadow: inset 0 0 0 1px var(--ring);
    }

    .model-row.recommended {
      border-color: rgba(247, 245, 134, 0.38);
    }

    .model-row:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .row-main {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: var(--space-2);
      align-items: start;
    }

    .radio-dot {
      margin-top: 5px;
      width: 10px;
      height: 10px;
      background: transparent;
      border: 1px solid var(--border-strong);
      box-shadow: none;
    }

    .current .radio-dot {
      border-color: var(--primary);
      background: var(--primary);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .disabled .radio-dot {
      border-color: var(--border);
      background: var(--input);
    }

    .row-title-line {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .row-title {
      min-width: 0;
      color: var(--foreground);
      font-size: 13px;
      font-weight: 650;
    }

    .row-copy {
      margin-top: 2px;
      font-size: 12px;
    }

    .badge {
      min-height: 20px;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }

    .badge.recommend {
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .badge.current-badge {
      border: 1px solid var(--primary);
      color: var(--primary);
      background: rgba(247, 245, 134, 0.08);
    }

    .badge.enterprise {
      border: 1px solid var(--border-strong);
      color: var(--muted-foreground);
      background: var(--input);
    }

    .tradeoffs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-2);
      padding-left: 26px;
    }

    .tradeoff {
      min-width: 0;
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--muted);
      padding: 5px 7px;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      font-size: 11px;
    }

    .tradeoff strong {
      color: var(--foreground);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .tradeoff span {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lock-note {
      margin-left: 26px;
      color: var(--muted-foreground);
      font-size: 12px;
    }

    .lock-note svg {
      width: 14px;
      height: 14px;
      color: var(--status-yellow300);
    }

    .popover-footer {
      padding: var(--space-3) var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      border-top: 1px solid var(--border);
      background: var(--muted);
    }

    .selection-summary {
      min-width: 0;
      display: grid;
      gap: 1px;
    }

    .selection-summary span {
      color: var(--muted-foreground);
      font-size: 11px;
    }

    .selection-summary strong {
      overflow: hidden;
      color: var(--foreground);
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .primary-action {
      flex: 0 0 auto;
      min-height: 36px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: var(--primary);
      color: var(--primary-foreground);
      padding: 0 12px;
      font-weight: 700;
      cursor: default;
    }

    @media (max-width: 880px) {
      .workspace {
        width: min(100% - 24px, 520px);
        padding: 24px 0;
        grid-template-columns: 1fr;
      }

      .composer-toolbar,
      .popover-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .model-trigger,
      .primary-action {
        width: 100%;
      }

      .toolbar-meta {
        justify-content: flex-start;
      }
    }

    @media (max-width: 460px) {
      .workspace {
        width: calc(100% - 16px);
        padding: 12px 0;
      }

      .composer-topbar,
      .popover-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .prompt-area,
      .composer-toolbar,
      .popover-header,
      .popover-footer {
        padding: var(--space-3);
      }

      .tradeoffs {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="workspace" aria-label="Kilo Cloud agent prompt composer">
    <section class="composer" aria-label="Agent prompt composer">
      <div class="composer-topbar">
        <div class="workspace-id">
          <span class="workspace-dot" aria-hidden="true"></span>
          <code>kilo-design</code>
          <span class="helper-text">Team workspace</span>
        </div>
        <div class="run-state">
          <span class="state-dot" aria-hidden="true"></span>
          KiloClaw operational
        </div>
      </div>

      <div class="prompt-area">
        <label class="field-label" for="agent-prompt">Agent prompt</label>
        <textarea class="prompt-input" id="agent-prompt" spellcheck="false">Review the latest agent run, check billing guardrails, and summarize the changed files before opening the pull request.</textarea>
      </div>

      <div class="composer-toolbar">
        <button class="model-trigger" type="button" aria-haspopup="dialog" aria-expanded="true" aria-controls="model-selector">
          <span>
            <span class="trigger-kicker">Model</span>
            <span class="trigger-name">Kilo Balanced</span>
            <span class="trigger-meta">Current selection · 1.6x run cost</span>
          </span>
          <svg class="chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="toolbar-meta" aria-label="Composer context">
          <span class="toolbar-chip">3 changed files</span>
          <span class="toolbar-chip">18 tool calls available</span>
        </div>
      </div>
    </section>

    <aside class="popover-panel" id="model-selector" role="dialog" aria-label="Select agent model">
      <div class="popover-header">
        <div>
          <h2>Select agent model</h2>
          <p class="helper-text">Run cost is billed to the kilo-design workspace subscription.</p>
        </div>
        <button class="icon-button" type="button" aria-label="Close model selector">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M6 6L14 14M14 6L6 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <div class="model-list" role="listbox" aria-label="Available agent models">
        <button class="model-row recommended" type="button" role="option" aria-selected="false">
          <span class="row-main">
            <span class="radio-dot" aria-hidden="true"></span>
            <span>
              <span class="row-title-line">
                <span class="row-title">Kilo Fast</span>
                <span class="badge recommend">Recommended</span>
              </span>
              <span class="row-copy">Best for scoped agent runs, changed-file summaries, and KiloClaw checks.</span>
            </span>
          </span>
          <span class="tradeoffs" aria-label="Kilo Fast tradeoffs">
            <span class="tradeoff"><strong>Fast</strong><span>Short queue</span></span>
            <span class="tradeoff"><strong>0.8x</strong><span>Run cost</span></span>
            <span class="tradeoff"><strong>64k</strong><span>Context</span></span>
          </span>
        </button>

        <button class="model-row current" type="button" role="option" aria-selected="true">
          <span class="row-main">
            <span class="radio-dot" aria-hidden="true"></span>
            <span>
              <span class="row-title-line">
                <span class="row-title">Kilo Balanced</span>
                <span class="badge current-badge">Current</span>
              </span>
              <span class="row-copy">Default workspace model for repo-aware edits, tool calls, and pull request prep.</span>
            </span>
          </span>
          <span class="tradeoffs" aria-label="Kilo Balanced tradeoffs">
            <span class="tradeoff"><strong>Medium</strong><span>Steady queue</span></span>
            <span class="tradeoff"><strong>1.6x</strong><span>Run cost</span></span>
            <span class="tradeoff"><strong>128k</strong><span>Context</span></span>
          </span>
        </button>

        <button class="model-row" type="button" role="option" aria-selected="false">
          <span class="row-main">
            <span class="radio-dot" aria-hidden="true"></span>
            <span>
              <span class="row-title-line">
                <span class="row-title">Kilo Deep</span>
              </span>
              <span class="row-copy">Slower reasoning for migrations, subscription logic, and cross-workspace audits.</span>
            </span>
          </span>
          <span class="tradeoffs" aria-label="Kilo Deep tradeoffs">
            <span class="tradeoff"><strong>Slow</strong><span>Long queue</span></span>
            <span class="tradeoff"><strong>3.4x</strong><span>Run cost</span></span>
            <span class="tradeoff"><strong>256k</strong><span>Context</span></span>
          </span>
        </button>

        <button class="model-row disabled" type="button" role="option" aria-selected="false" aria-disabled="true" disabled>
          <span class="row-main">
            <span class="radio-dot" aria-hidden="true"></span>
            <span>
              <span class="row-title-line">
                <span class="row-title">Private Workspace Max</span>
                <span class="badge enterprise">Enterprise</span>
              </span>
              <span class="row-copy">Dedicated capacity for regulated teams, security review, and audit retention.</span>
            </span>
          </span>
          <span class="tradeoffs" aria-label="Private Workspace Max tradeoffs">
            <span class="tradeoff"><strong>Medium</strong><span>Reserved</span></span>
            <span class="tradeoff"><strong>Contract</strong><span>Billing</span></span>
            <span class="tradeoff"><strong>512k</strong><span>Context</span></span>
          </span>
          <span class="lock-note">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M6.5 8V6.5C6.5 4.6 8 3.25 10 3.25S13.5 4.6 13.5 6.5V8M5.5 8H14.5V15.5H5.5V8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            </svg>
            Requires Enterprise subscription and workspace security approval.
          </span>
        </button>

        <button class="model-row disabled" type="button" role="option" aria-selected="false" aria-disabled="true" disabled>
          <span class="row-main">
            <span class="radio-dot" aria-hidden="true"></span>
            <span>
              <span class="row-title-line">
                <span class="row-title">KiloClaw Enterprise Reviewer</span>
                <span class="badge enterprise">Enterprise</span>
              </span>
              <span class="row-copy">Org-wide changed-file review with expanded tool calls and compliance logs.</span>
            </span>
          </span>
          <span class="tradeoffs" aria-label="KiloClaw Enterprise Reviewer tradeoffs">
            <span class="tradeoff"><strong>Slow</strong><span>Deep scan</span></span>
            <span class="tradeoff"><strong>Contract</strong><span>Billing</span></span>
            <span class="tradeoff"><strong>1M</strong><span>Context</span></span>
          </span>
          <span class="lock-note">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M6.5 8V6.5C6.5 4.6 8 3.25 10 3.25S13.5 4.6 13.5 6.5V8M5.5 8H14.5V15.5H5.5V8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            </svg>
            Ask a team owner to upgrade the workspace subscription.
          </span>
        </button>
      </div>

      <div class="popover-footer">
        <span class="selection-summary">
          <span>Current selection</span>
          <strong>Kilo Balanced</strong>
          <span class="selection-meta">Tool calls and run cost update before the agent starts.</span>
        </span>
        <button class="primary-action" type="button">Use selected model</button>
      </div>
    </aside>
  </main>
</body>
</html>
