<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilo Skill Arena</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="round-list" id="roundList"></main>

<div class="preview" id="preview" hidden>
  <div class="preview-panel" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="preview-head">
      <div>
        <strong id="previewTitle"></strong>
        <span id="previewStatus"></span>
      </div>
      <div class="preview-actions">
        <a id="previewPage" target="_blank" rel="noreferrer">Page</a>
        <button id="previewClose" type="button">Close</button>
      </div>
    </div>
    <iframe id="previewFrame" title="Generated output preview"></iframe>
  </div>
</div>

<div class="composer-dock">
  <form class="composer" id="composer">
    <div class="composer-head">
      <div class="composer-title">
        <span class="composer-mark" aria-hidden="true"></span>
        <div>
          <strong>New battle</strong>
          <span>Run one prompt across all three skill conditions</span>
        </div>
      </div>
      <span class="composer-status" id="composerStatus" aria-live="polite">ready</span>
    </div>
    <label class="prompt-field" for="promptInput">
      <span class="sr-only">Battle prompt</span>
      <textarea id="promptInput" spellcheck="false" placeholder="Describe the interface you want the agents to design..."></textarea>
    </label>
    <div class="composer-footer">
      <span class="composer-hint"><kbd>⌘</kbd><kbd>Enter</kbd> to run</span>
      <div class="composer-actions">
        <button id="stopGeneration" class="secondary" type="button" disabled>Stop run</button>
        <button id="regenerate" type="submit">
          <span>Run battle</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.25 8h9.5M9 4.25 12.75 8 9 11.75"/></svg>
        </button>
      </div>
    </div>
  </form>
</div>

<script src="/app.js"></script>
</body>
</html>
