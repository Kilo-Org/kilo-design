name: Tokens

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  valid:
    name: tokens.json is valid and the app builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build validates tokens.json (both modes, aliases) and typechecks the app.
      - name: Build the app
        run: pnpm --dir north-star build
