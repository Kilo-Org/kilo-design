name: Tokens

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  staleness:
    name: Generated artifacts are current
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate token artifacts
        run: node build

      - name: Check generated artifacts are committed
        run: git diff --exit-code -- src/tokens.web.css src/tokens.cloud.ts src/tokens.editor-host-map.md
